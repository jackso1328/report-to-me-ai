[project]
name = "report-to-me-ai"
version = "0.1.0"
description = "AI-powered guardian/guide for real-world problems."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "backend/tests",
]
pythonpath = [
    "backend",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
