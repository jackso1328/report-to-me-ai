AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  report-to-me-ai
  
  M1.2 Foundation - Health Endpoint

Globals:
  Function:
    Timeout: 3
    MemorySize: 128
    Runtime: python3.10
    Architectures:
      - x86_64
    Environment:
      Variables:
        APP_NAME: !Ref AppName
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: INFO
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        AI_PROVIDER: !Ref AIProvider
        DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
        PROMPT_VERSION: "v1"

Parameters:
  AppName:
    Type: String
    Default: "Report-to-Me AI"
    Description: Name of the application
  Environment:
    Type: String
    Default: "dev"
    Description: Environment (dev, staging, prod)
  BedrockModelId:
    Type: String
    Default: "amazon.nova-lite-v1:0"
    Description: Amazon Bedrock Model ID to use for AI Analysis
  AIProvider:
    Type: String
    Default: "fake"
    Description: Provider to use for AI Analysis (bedrock or fake)
  DynamoDBTableName:
    Type: String
    Default: "ReportToMe"
    Description: DynamoDB Table Name for Incidents

Resources:
  # HTTP API
  ReportToMeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "Content-Type"
          - "Idempotency-Key"
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  # Health Lambda Function
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.health.lambda_handler
      # Implicit IAM Role with minimal permissions (AWSLambdaBasicExecutionRole) is created by SAM
      Events:
        Health:
          Type: HttpApi
          Properties:
            Path: /api/v1/health
            Method: get
            ApiId: !Ref ReportToMeApi
      Policies:
        # Least privilege: only allow cloudwatch logging (which AWSLambdaBasicExecutionRole includes)
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

  # Analyze Test Lambda Function (Manual Invocation for PoC)
  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.analyze_poc.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"

  # Signal API Function (Ingestion + Core Pipeline)
  SignalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.signals.lambda_handler
      Timeout: 15 # Analysis could take up to 10s
      Events:
        PostSignal:
          Type: HttpApi
          Properties:
            Path: /api/v1/signals
            Method: post
            ApiId: !Ref ReportToMeApi
        GetSignal:
          Type: HttpApi
          Properties:
            Path: /api/v1/signals/{signalId}
            Method: get
            ApiId: !Ref ReportToMeApi
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportToMeTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"

  # Incident API Function
  IncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.incidents.lambda_handler
      Events:
        GetIncident:
          Type: HttpApi
          Properties:
            Path: /api/v1/incidents/{incidentId}
            Method: get
            ApiId: !Ref ReportToMeApi
        ListIncidents:
          Type: HttpApi
          Properties:
            Path: /api/v1/incidents
            Method: get
            ApiId: !Ref ReportToMeApi
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
        - DynamoDBReadPolicy:
            TableName: !Ref ReportToMeTable

  # DynamoDB Table
  ReportToMeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusTimeIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  HealthApiUrl:
    Description: "API Gateway endpoint URL for Health check"
    Value: !Sub "https://${ReportToMeApi}.execute-api.${AWS::Region}.amazonaws.com/v1/api/v1/health"
  ApiUrl:
    Description: "API Gateway base URL"
    Value: !Sub "https://${ReportToMeApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
