AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  report-to-me-ai
  
  M1.2 Foundation - Health Endpoint

Globals:
  Function:
    Timeout: 3
    MemorySize: 128
    Runtime: python3.10
    Architectures:
      - x86_64
    Environment:
      Variables:
        APP_NAME: !Ref AppName
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: INFO
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        AI_PROVIDER: !Ref AIProvider
        DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
        PROMPT_VERSION: "v1"
        EVENT_BUS_NAME: !Ref ReportToMeEventBus
        # The CollectionEndpoint depends on OpenSearch collection creation. 
        # Using a direct reference here might create circular deps or issues if done globally, 
        # so we inject it specifically into AiWorkerFunction and IndexerFunction.

Parameters:
  AppName:
    Type: String
    Default: "Report-to-Me AI"
    Description: Name of the application
  Environment:
    Type: String
    Default: "dev"
    Description: Environment (dev, staging, prod)
  BedrockModelId:
    Type: String
    Default: "amazon.nova-lite-v1:0"
    Description: Amazon Bedrock Model ID to use for AI Analysis
  AIProvider:
    Type: String
    Default: "fake"
    Description: Provider to use for AI Analysis (bedrock or fake)
  DynamoDBTableName:
    Type: String
    Default: "ReportToMe"
    Description: DynamoDB Table Name for Incidents

Resources:
  # HTTP API
  ReportToMeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:5173"
          - "http://localhost:5174"
        AllowHeaders:
          - "Content-Type"
          - "Idempotency-Key"
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS

  # AI Processing Queues
  AiProcessingDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days

  AiProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiProcessingDlq.Arn
        maxReceiveCount: 3

  # AI Worker Function
  AiWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.ai_worker.lambda_handler
      Timeout: 60
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !GetAtt IncidentMemoryCollection.CollectionEndpoint
          OPENSEARCH_INDEX_NAME: "incident-memory-v1"
      Events:
        SQSQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AiProcessingQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
              Resource: !GetAtt IncidentMemoryCollection.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportToMeTable

  # Human Review Workflow (Step Functions)
  HumanReviewWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AppName}-HumanReviewWorkflow-${Environment}"
      Definition:
        StartAt: PrepareReviewAndWait
        States:
          PrepareReviewAndWait:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            TimeoutSeconds: 86400
            Parameters:
              FunctionName: !Ref PrepareReviewFunction
              Payload:
                incidentId.$: "$.detail.incidentId"
                taskToken.$: "$$.Task.Token"
                executionId.$: "$$.Execution.Id"
            ResultPath: "$.reviewOutput"
            Catch:
              - ErrorEquals: ["DynamoDB.ConditionalCheckFailedException"]
                Next: DuplicateExecution
              - ErrorEquals: ["States.Timeout"]
                Next: HandleTimeout
            Next: ProcessDecision
          DuplicateExecution:
            Type: Pass
            End: true
          HandleTimeout:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: !Ref DynamoDBTableName
              Key:
                PK:
                  "S.$": "States.Format('INCIDENT#{}', $.detail.incidentId)"
                SK:
                  S: META
              UpdateExpression: "SET #s = :s, reviewState = :s, GSI1PK = :gsi REMOVE taskToken"
              ExpressionAttributeNames:
                "#s": "status"
              ExpressionAttributeValues:
                ":s":
                  S: timed_out
                ":gsi":
                  S: "STATUS#timed_out"
            ResultPath: null
            Next: PersistTimeoutAuditRecord
          ProcessDecision:
            Type: Choice
            Choices:
              - Variable: "$.reviewOutput.status"
                StringEquals: approved
                Next: UpdateStatusApproved
              - Variable: "$.reviewOutput.status"
                StringEquals: rejected
                Next: UpdateStatusRejected
            Default: UpdateStatusRejected
          UpdateStatusApproved:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: !Ref DynamoDBTableName
              Key:
                PK:
                  "S.$": "States.Format('INCIDENT#{}', $.detail.incidentId)"
                SK:
                  S: META
              UpdateExpression: "SET #s = :s, reviewState = :s, GSI1PK = :gsi REMOVE taskToken"
              ExpressionAttributeNames:
                "#s": "status"
              ExpressionAttributeValues:
                ":s":
                  S: approved
                ":gsi":
                  S: "STATUS#approved"
            ResultPath: null
            Next: PersistAuditRecord
          UpdateStatusRejected:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: !Ref DynamoDBTableName
              Key:
                PK:
                  "S.$": "States.Format('INCIDENT#{}', $.detail.incidentId)"
                SK:
                  S: META
              UpdateExpression: "SET #s = :s, reviewState = :s, GSI1PK = :gsi REMOVE taskToken"
              ExpressionAttributeNames:
                "#s": "status"
              ExpressionAttributeValues:
                ":s":
                  S: rejected
                ":gsi":
                  S: "STATUS#rejected"
            ResultPath: null
            Next: PersistAuditRecord
          PersistAuditRecord:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Parameters:
              TableName: !Ref DynamoDBTableName
              Item:
                PK:
                  "S.$": "States.Format('INCIDENT#{}', $.detail.incidentId)"
                SK:
                  "S.$": "States.Format('REVIEW#{}', $$.State.EnteredTime)"
                reviewId:
                  "S.$": "States.Format('rev_{}', $$.Execution.Name)"
                decision:
                  "S.$": "$.reviewOutput.status"
                reviewer:
                  "S.$": "$.reviewOutput.reviewer"
                comments:
                  "S.$": "$.reviewOutput.comments"
                decidedAt:
                  "S.$": "$$.State.EnteredTime"
                workflowExecutionId:
                  "S.$": "$$.Execution.Id"
                eventId:
                  "S.$": "$.detail.eventId"
            End: true
          PersistTimeoutAuditRecord:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Parameters:
              TableName: !Ref DynamoDBTableName
              Item:
                PK:
                  "S.$": "States.Format('INCIDENT#{}', $.detail.incidentId)"
                SK:
                  "S.$": "States.Format('REVIEW#{}', $$.State.EnteredTime)"
                reviewId:
                  "S.$": "States.Format('rev_{}', $$.Execution.Name)"
                decision:
                  S: timed_out
                reviewer:
                  S: system
                comments:
                  S: Review timed out after 24 hours
                decidedAt:
                  "S.$": "$$.State.EnteredTime"
                workflowExecutionId:
                  "S.$": "$$.Execution.Id"
                eventId:
                  "S.$": "$.detail.eventId"
            End: true
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource: !GetAtt ReportToMeTable.Arn
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt PrepareReviewFunction.Arn

  # EventBridge Event Bus
  ReportToMeEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${AppName}-EventBus-${Environment}"

  # OpenSearch Serverless for Incident Memory
  IncidentMemoryCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn: 
      - IncidentMemoryEncryptionPolicy
      - IncidentMemoryNetworkPolicy
    Properties:
      Name: !Sub "incident-memory-${Environment}"
      Type: SEARCH
      Description: "Lexical BM25 search collection for incident memory"

  IncidentMemoryEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "enc-policy-${Environment}"
      Type: encryption
      Policy: !Sub >
        {"Rules":[{"ResourceType":"collection","Resource":["collection/incident-memory-${Environment}"]}],"AWSOwnedKey":true}

  IncidentMemoryNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "net-policy-${Environment}"
      Type: network
      Policy: !Sub >
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/incident-memory-${Environment}"]}],"AllowFromPublic":true}]

  IncidentMemoryDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "data-policy-${Environment}"
      Type: data
      Policy: !Sub >
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/incident-memory-${Environment}"],"Permission":["aoss:CreateCollectionItems","aoss:DeleteCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]},{"ResourceType":"index","Resource":["index/incident-memory-v1/*","index/incident-memory-v1"],"Permission":["aoss:CreateIndex","aoss:DeleteIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]}],"Principal":["${IndexerFunctionRole.Arn}","${AiWorkerFunctionRole.Arn}"]}]

  # EventBridge Rule routing to Memory Indexer
  MemoryIndexerRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref ReportToMeEventBus
      Name: !Sub "${AppName}-MemoryIndexerRule-${Environment}"
      State: ENABLED
      EventPattern:
        source:
          - "report-to-me"
        detail-type:
          - "IncidentUpdated"
      Targets:
        - Arn: !GetAtt IndexerFunction.Arn
          Id: "IndexerTarget"

  IndexerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.indexer.lambda_handler
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !GetAtt IncidentMemoryCollection.CollectionEndpoint
          OPENSEARCH_INDEX_NAME: "incident-memory-v1"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
              Resource: !GetAtt IncidentMemoryCollection.Arn

  IndexerFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IndexerFunction
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt MemoryIndexerRule.Arn

  PrepareReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.prepare_review.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportToMeTable
      Environment:
        Variables:
          TABLE_NAME: !Ref ReportToMeTable

  # EventBridge Rule routing to AiProcessingQueue
  AiProcessingRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref ReportToMeEventBus
      Name: !Sub "${AppName}-AiProcessingRule-${Environment}"
      State: ENABLED
      EventPattern:
        source:
          - "report-to-me"
        detail-type:
          - "SignalCreated"
      Targets:
        - Arn: !GetAtt AiProcessingQueue.Arn
          Id: "AiProcessingQueueTarget"
          DeadLetterConfig:
            Arn: !GetAtt AiProcessingDlq.Arn
          InputTransformer:
            InputPathsMap:
              incidentId: "$.detail.detail.incidentId"
              signalId: "$.detail.detail.signalId"
            InputTemplate: |
              {
                "incidentId": <incidentId>,
                "signalId": <signalId>,
                "schemaVersion": "1.0"
              }

  # EventBridge Rule routing to Step Functions
  HumanReviewRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref ReportToMeEventBus
      Name: !Sub "${AppName}-HumanReviewRule-${Environment}"
      State: ENABLED
      EventPattern:
        source:
          - "report-to-me"
        detail-type:
          - "HumanReviewRequired"
      Targets:
        - Arn: !Ref HumanReviewWorkflow
          Id: "HumanReviewTarget"
          RoleArn: !GetAtt EventBridgeInvokeStepFunctionsRole.Arn

  EventBridgeInvokeStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "events.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: InvokeStepFunctions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "states:StartExecution"
                Resource: !Ref HumanReviewWorkflow

  # SQS Queue Policy to allow EventBridge
  AiProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AiProcessingQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "events.amazonaws.com"
            Action: "sqs:SendMessage"
            Resource: !GetAtt AiProcessingQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt AiProcessingRule.Arn

  # Stream Publisher Function
  StreamPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.stream_publisher.lambda_handler
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref ReportToMeEventBus
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ReportToMeTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            MaximumRetryAttempts: 3
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt AiProcessingDlq.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
        - Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt ReportToMeEventBus.Arn
        - SQSSendMessagePolicy:
              QueueName: !GetAtt AiProcessingDlq.QueueName

  # Evidence S3 Bucket
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
            ExposedHeaders:
              - ETag
            MaxAge: 300

  # Presign Function
  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.evidence.lambda_handler
      Environment:
        Variables:
          EVIDENCE_BUCKET: !Ref EvidenceBucket
      Events:
        PresignUrl:
          Type: HttpApi
          Properties:
            Path: /api/v1/evidence/presign
            Method: post
            ApiId: !Ref ReportToMeApi
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
                - logs:GetLogEvents
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${EvidenceBucket.Arn}/*"

  # Health Lambda Function
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.health.lambda_handler
      # Implicit IAM Role with minimal permissions (AWSLambdaBasicExecutionRole) is created by SAM
      Events:
        Health:
          Type: HttpApi
          Properties:
            Path: /api/v1/health
            Method: get
            ApiId: !Ref ReportToMeApi
      Policies:
        # Least privilege: only allow cloudwatch logging (which AWSLambdaBasicExecutionRole includes)
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

  # Analyze Test Lambda Function (Manual Invocation for PoC)
  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.analyze_poc.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"

  # Signal API Function (Ingestion + Core Pipeline)
  SignalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.signals.lambda_handler
      Timeout: 15 # Analysis could take up to 10s
      Events:
        PostSignal:
          Type: HttpApi
          Properties:
            Path: /api/v1/signals
            Method: post
            ApiId: !Ref ReportToMeApi
        GetSignal:
          Type: HttpApi
          Properties:
            Path: /api/v1/signals/{signalId}
            Method: get
            ApiId: !Ref ReportToMeApi
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportToMeTable

  # Incident API Function
  IncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handlers.incidents.lambda_handler
      Events:
        GetIncident:
          Type: HttpApi
          Properties:
            Path: /api/v1/incidents/{incidentId}
            Method: get
            ApiId: !Ref ReportToMeApi
        ListIncidents:
          Type: HttpApi
          Properties:
            Path: /api/v1/incidents
            Method: get
            ApiId: !Ref ReportToMeApi
        UpdateIncidentReview:
          Type: HttpApi
          Properties:
            Path: /api/v1/incidents/{incidentId}/review
            Method: patch
            ApiId: !Ref ReportToMeApi
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportToMeTable
        - Statement:
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
              Resource: !Ref HumanReviewWorkflow

  # DynamoDB Table
  ReportToMeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusTimeIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  HealthApiUrl:
    Description: "API Gateway endpoint URL for Health check"
    Value: !Sub "https://${ReportToMeApi}.execute-api.${AWS::Region}.amazonaws.com/v1/api/v1/health"
  ApiUrl:
    Description: "API Gateway base URL"
    Value: !Sub "https://${ReportToMeApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
